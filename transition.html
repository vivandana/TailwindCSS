<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition with tailwind css</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <button class="bg-cyan-400 p-2 m-10 text-white  rounded   hover:bg-blue-600">Login</button>
    <button class="bg-cyan-400 p-2 m-10 text-white  rounded   hover:bg-blue-600
    transition        duration-1000  
    ">Sign up</button>
    <button class="bg-cyan-400 p-2 m-10 text-white  rounded   hover:bg-blue-600
    transition    duration-1000  hover:opacity-5 
    ">Login</button>

    <button class="bg-red-400 p-2 m-10 text-white  rounded   hover:bg-yellow-600
   hover:rotate-180 transition-transform duration-1000
    ">Login</button>

     <button class="bg-red-400 p-2 m-10 text-white  rounded   hover:bg-yellow-600
   hover:scale-150 transition-transform duration-1000
    ">Login</button>

    <button class="bg-red-400 p-2 m-10 text-white  rounded   hover:bg-yellow-600
   hover:scale-x-150 transition-transform duration-1000
    ">Login</button>

    <button class="bg-red-400 p-2 m-10 text-white  rounded   hover:bg-yellow-600
   hover:scale-y-150 transition-transform duration-1000
    ">Login</button>

    <button class="bg-red-400 p-2 m-10 text-white  rounded   hover:bg-yellow-600
   hover:scale-x-150  hover:scale-y-50 transition-transform duration-1000
    ">Login</button>


    <img src="github.avif" alt="" class="m-20 w-56 hover:rotate-45 hover:scale-125 transition-transform duration-1000">

</body>
</html>
